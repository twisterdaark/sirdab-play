<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0;background:#120e0b}</style>
</head>
<body>
<title>سرداب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@500;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one phone-sized column; art band on top, story text, choices near the thumb. Deliberately single dark candlelit look. */
:root{
  color-scheme:dark;
  --bg:#120e0b; --card:#251d17; --card2:#30251c; --line:#4a3a2c;
  --gold:#e0b25a; --gold2:#f3d48f; --ink:#f4e9d8; --mute:#b9a88f; --dim:#86745f;
  --hp:#d0533f; --en:#6db8f2; --ok:#6fb36a; --okbg:#6fb36a22; --warn:#e3a43b; --warnbg:#e3a43b22; --bad:#d0483b; --badbg:#d0483b22;
  --display:"Reem Kufi","Cairo",system-ui,sans-serif; --body:"Cairo",system-ui,sans-serif; --story:"Amiri","Cairo",serif;
}
html,body{height:100%}
body{background:#0a0807;color:var(--ink);font-family:var(--body);margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{direction:rtl;position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#3a2a1a 0%,var(--bg) 55%);display:flex;flex-direction:column}
#app,#app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app input,#app textarea{-webkit-user-select:text;user-select:text}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:0 16px 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px}
.top h2{font-family:var(--display);font-size:20px;color:var(--gold2);margin:0;text-wrap:balance}
.ib{min-width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;padding:0 12px;font-size:13px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;font-weight:800;font-size:17px;border:0;cursor:pointer;width:100%;
  background:linear-gradient(180deg,#f0c56c,#c98f2e);color:#2a1a08;box-shadow:0 6px 24px #e0b25a33, inset 0 1px 0 #fff6;padding:8px 16px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.small{min-height:42px;font-size:14px}
.btn:focus-visible,.ch:focus-visible,.opt:focus-visible,.ib:focus-visible,.act:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.label{font-size:13px;color:var(--dim);font-weight:700;margin:14px 0 8px}
.story{font-family:var(--story);font-size:19px;line-height:1.85;color:var(--ink)}
.story b{color:var(--gold2)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:15px}
.ch:hover{border-color:var(--gold)}
.ch small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.ch .need{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
.ch.ghost{background:transparent;border-style:dashed;color:var(--mute)}
.chance{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.c-good{background:var(--okbg);color:#a6e3a0}.c-mid{background:var(--warnbg);color:#f2c77a}.c-low{background:var(--badbg);color:#f0a090}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.55;padding:3px 9px;border-radius:20px;background:#0005;border:1px solid var(--line);color:var(--mute);font-weight:700;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:#0007;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.art{margin:0 -16px;height:190px;position:relative;flex:none;overflow:hidden}
.art svg{display:block;width:100%;height:100%}
.fade{position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(transparent,var(--bg))}
.art .chips{position:absolute;top:12px;right:16px;left:16px;display:flex;justify-content:space-between;gap:8px}
.chips .tag{background:#000b}
.chips>span{flex:none}.chips>.tag:first-child{display:block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chips .snd,.chips #qb{padding:3px 8px}@media (max-width:350px){.chips .tag{font-size:11px;padding:3px 7px}.chips>span{gap:4px!important}}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:#3a2f25}.dots i.on{background:var(--gold)}.dots i.up{background:#ffd36a;box-shadow:0 0 6px #ffd36a}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.opt.on{background:var(--card2);border:2px solid var(--gold);color:var(--gold2)}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--gold2);box-shadow:0 0 0 3px var(--bg) inset}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:10px 12px;font-size:15px}
textarea{min-height:64px;resize:vertical}
.coach{display:flex;gap:10px;align-items:flex-start;background:#4f93d614;border:1px solid #2f5b85;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.7}
.coach .who{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;background:#20304a}
.coach b{color:#9fc6ee}
.hidden{display:none!important}
.bolt{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 10px 14px -6px var(--bg);margin:0 -16px;padding:8px 16px 12px}

/* dice */
#dice{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,#3d2c18f2 0%,#0b0907fa 70%);display:flex;flex-direction:column;align-items:center;padding:22px 16px;text-align:center;touch-action:none}
#dice .what{font-size:16px;color:var(--ink);font-weight:700}
#dice .stat{font-size:14px;margin-top:4px;color:var(--mute)}
#dz{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:24px;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.die{width:92px;height:92px;border-radius:20px;background:linear-gradient(145deg,#fbf3e2,#d9c7a4);box-shadow:0 10px 24px #0009, inset 0 -4px 0 #0002;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px}
.die b{width:15px;height:15px;border-radius:50%;background:#3a1d10;align-self:center;justify-self:center;visibility:hidden}
.die b.v{visibility:visible}
.die.keep{outline:3px solid var(--gold2);outline-offset:4px}
.die.drop{opacity:.35}
.d20{width:118px;height:118px}
.d20 text{font-family:var(--display);font-weight:700}
.dwrap{display:inline-block}
#dz.shaking .dwrap{animation:jig var(--spd,.12s) infinite alternate}
@keyframes jig{from{transform:translate(calc(var(--amp,4px)*-1),2px) rotate(calc(var(--rot,8deg)*-1))}to{transform:translate(var(--amp,4px),-3px) rotate(var(--rot,8deg))}}
#power{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:160px;height:8px;border-radius:5px;background:#0008;overflow:hidden}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0b25a,#ff7a4a);border-radius:5px}
#dice .hint{color:var(--mute);font-size:14px;min-height:22px}
#dice .total{font-family:var(--display);font-size:60px;color:var(--gold2);line-height:1;text-shadow:0 0 30px #e0b25a88}
#dice .sum{font-size:14px;color:var(--mute)}
.banner{display:inline-block;margin-top:10px;padding:8px 22px;border-radius:30px;font-weight:800;font-size:20px;border:1px solid}
.b-full{background:var(--okbg);border-color:var(--ok);color:#a6e3a0}.b-part{background:var(--warnbg);border-color:var(--warn);color:#f2c77a}.b-fail{background:var(--badbg);border-color:var(--bad);color:#f0a090}
.explain{font-size:12px;color:var(--mute);margin-top:6px}

/* combat */
.turn{text-align:center;font-weight:800;font-size:14px;padding:6px;border-radius:10px;margin-bottom:6px}
.turn.me{background:var(--okbg);color:#a6e3a0}.turn.them{background:var(--badbg);color:#f0a090}
.foes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.foe{position:relative;width:128px;border-radius:16px;background:#2a0f0c88;border:1px solid #6a2a22;padding:8px;cursor:pointer;text-align:center}
.foe.tgt{border:2px solid var(--gold2);box-shadow:0 0 18px #e0b25a44}
.foe.dead{opacity:.25;filter:grayscale(1);pointer-events:none}
.foe svg{width:88px;height:88px}
.foe .nm{font-weight:700;font-size:13px}
.foe .hpn{font-size:11px;color:#f0a090}
.side{display:flex;gap:8px}
.mate{flex:1;min-width:0;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.mate.me{border-color:var(--gold)}
.mate .pic{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;background:#000}
.mate .info{flex:1;min-width:0;font-size:12px}
.mate .info b{font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:right}
.act b{display:block;font-size:15px}
.act small{display:block;color:var(--mute);font-size:12px;line-height:1.5}
.act .cost{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.cost.free{background:#ffffff10;color:var(--mute)}.cost.en{background:#6db8f222;color:var(--en)}
.act.main{background:var(--card2);border-color:var(--gold)}
.act.main b{color:var(--gold2)}
.act[disabled]{opacity:.4;pointer-events:none}
.log{margin-top:10px;background:#0006;border:1px solid var(--line);border-radius:14px;padding:8px 12px;max-height:150px;overflow-y:auto}
.log .h{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:4px}
.log p{margin:0;padding:3px 0;font-size:14px;line-height:1.6;color:var(--mute);border-bottom:1px dashed #ffffff0d}
.log p:last-child{color:var(--ink);font-weight:700}
.log p.good{color:#a6e3a0}.log p.bad{color:#f0a090}
.log p:last-child.good{color:#c3f0be}.log p:last-child.bad{color:#ffb3a3}

/* effects */
.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0}
#flash.go{animation:fl .45s}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.float{position:absolute;z-index:45;pointer-events:none;font-family:var(--display);font-weight:700;font-size:26px;text-shadow:0 2px 6px #000;animation:up 1.2s forwards;white-space:nowrap}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-8px) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.slash{position:absolute;z-index:44;pointer-events:none;height:6px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px #fff;animation:sl .32s forwards}
@keyframes sl{0%{transform:rotate(-35deg) scaleX(0);opacity:1}60%{transform:rotate(-35deg) scaleX(1);opacity:1}100%{transform:rotate(-35deg) scaleX(1.1);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:43}
.hitme{animation:hm .4s}
@keyframes hm{0%,100%{filter:none}30%{filter:brightness(2) saturate(0)}}
.glow{animation:gl .9s}
@keyframes gl{0%{box-shadow:0 0 0 #6fb36a}40%{box-shadow:0 0 28px #6fb36a}100%{box-shadow:0 0 0 #6fb36a}}
.pop{animation:pp .5s both}
@keyframes pp{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.title{font-family:var(--display);font-size:72px;color:var(--gold2);text-shadow:0 0 30px #e0b25a66;line-height:1.1;margin:0}
.sub{font-family:var(--story);font-size:19px;color:var(--mute)}
.step-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.step-dots i{width:8px;height:8px;border-radius:50%;background:#3a2f25}.step-dots i.on{background:var(--gold);width:20px;border-radius:5px}
.res{border-radius:14px;padding:12px 14px;margin-top:10px;font-family:var(--story);font-size:18px;line-height:1.8}
.res b{color:var(--gold2)}
.res.full{background:var(--okbg);border:1px solid #3f6b3c}.res.part{background:var(--warnbg);border:1px solid #6b5326}.res.fail{background:var(--badbg);border:1px solid #6b2a24}.res.plain{background:var(--card);border:1px solid var(--line)}
.note{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px;font-family:var(--body);font-weight:700}
.shop{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.shop .ic{width:44px;height:44px;flex:none;border-radius:12px;background:#0005;display:grid;place-items:center}
.shop .tx{flex:1;min-width:0}
.shop .tx small{display:block;color:var(--mute);font-size:12px}
.buy{flex:none;border:1px solid var(--gold);background:var(--card2);color:var(--gold2);border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:13px}
.buy[disabled]{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* v3 additions */
.drop{opacity:.28;filter:grayscale(1)}
.dwrap{position:relative}
.dwrap .x{position:absolute;inset:0;display:grid;place-items:center;font-size:70px;font-weight:800;color:#f0a090;text-shadow:0 2px 8px #000;pointer-events:none}
#dice .advline{font-size:14px;color:#a6e3a0;min-height:20px;margin-top:4px}
#dice .hint small{display:block;font-size:12px;color:var(--dim)}
#dice .sum b{color:var(--gold2)}
.modchip{display:inline-block;margin-inline-start:6px;padding:2px 10px;border-radius:20px;font-size:15px;font-weight:800;vertical-align:middle;animation:pp .4s both}
.modchip.plus{background:var(--okbg);color:#a6e3a0}.modchip.minus{background:var(--badbg);color:#f0a090}
.total.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#band{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);z-index:60;pointer-events:none;padding:26px 10px 22px;background:linear-gradient(90deg,transparent,#000e 14%,#000e 86%,transparent);text-align:center;opacity:0}
#band.go{animation:bandIn var(--bd,2.4s) forwards}
#band .s1{font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:.5px;color:#d9c79a}
#band .t{font-family:var(--story);font-weight:700;font-size:44px;line-height:1.25;color:#f7e27c;text-shadow:0 0 22px #e0b25acc,0 0 2px #000,0 3px 0 #6a4a10}
#band.go .t{animation:bandText var(--bd,2.4s) forwards}
#band .s2{font-size:13px;color:#cdbb91;margin-top:2px}
#band.red .t{color:#ff8a7a;text-shadow:0 0 22px #d0483bcc,0 3px 0 #4a120c}
#band.blue .t{color:#bfe6ff;text-shadow:0 0 22px #5aa8ffcc,0 3px 0 #10304a}
@keyframes bandIn{0%{opacity:0}8%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes bandText{0%{transform:scale(1.35);filter:blur(8px);opacity:0}12%{transform:scale(1);filter:none;opacity:1}100%{transform:scale(1.06)}}
.foe .lv{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;color:#f0a090;background:#0008;border-radius:10px;padding:1px 6px}
.foe.pick{animation:pick 1s infinite;border-color:var(--gold2)}
@keyframes pick{0%,100%{box-shadow:0 0 0 #e0b25a00}50%{box-shadow:0 0 24px #e0b25aaa}}
.foe.hit{animation:hitk .38s}
@keyframes hitk{0%{filter:brightness(3.2) saturate(0);transform:translateX(0)}25%{transform:translateX(-12px) rotate(-3deg)}60%{transform:translateX(4px)}100%{filter:none;transform:none}}
.foe.die{animation:fdie .6s forwards}
@keyframes fdie{0%{transform:scale(1)}30%{transform:scale(1.12);filter:brightness(2.5)}100%{transform:scale(.8);opacity:.25;filter:grayscale(1)}}
.hb{position:relative;height:8px;border-radius:5px;background:#0007;overflow:hidden}
.hb .g,.hb .f{position:absolute;inset:0 auto 0 0;border-radius:5px}
.hb .g{background:#fff8;transition:width .7s ease-in .25s}
.hb .f{transition:width .15s}
.mate.down{opacity:.55;filter:grayscale(.8)}
.mate .dn{color:#f0a090;font-weight:800}
.turn.pick{background:#e0b25a22;color:var(--gold2)}
.sheet{margin-top:10px;background:var(--card2);border:1px solid var(--gold);border-radius:16px;padding:10px}
.sheet .h{font-weight:800;font-size:14px;color:var(--gold2);margin-bottom:8px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;margin-bottom:6px}
.it[disabled]{opacity:.4;pointer-events:none}
.it .ic{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#0005;border-radius:10px}
.it small{display:block;color:var(--mute);font-size:12px}
.coin{position:absolute;z-index:46;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e0b25a 55%,#9a6a1a);box-shadow:0 0 8px #f3c14d;pointer-events:none}
.combo{position:absolute;z-index:47;pointer-events:none;font-family:var(--display);font-weight:700;color:#ffd36a;text-shadow:0 0 12px #e0b25a,0 2px 4px #000;animation:cmb 1s forwards}
@keyframes cmb{0%{transform:scale(.4) rotate(-8deg);opacity:0}20%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}
.float.crit{color:#ffd36a!important;font-size:44px;text-shadow:0 0 16px #e0b25a,0 2px 6px #000}
.chest{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:120px;padding:10px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chest.shk{animation:cshk .5s}
@keyframes cshk{0%,100%{transform:none}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.chest.open{cursor:default}
.chest .beam{position:absolute;inset:-30px 20px auto;height:120px;background:linear-gradient(transparent,var(--rc,#fff) 40%,transparent);opacity:.0;filter:blur(8px);pointer-events:none}
.chest.open .beam{animation:beam 1.6s forwards}
@keyframes beam{0%{opacity:0;transform:scaleY(.2)}30%{opacity:.75;transform:scaleY(1.1)}100%{opacity:.25;transform:scaleY(1)}}
.chest .rn{font-size:11px;font-weight:800}
.chest .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.4}
.xpbar{height:12px;border-radius:7px;background:#0007;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98f2e,#f3d48f);transition:width .9s cubic-bezier(.3,.7,.3,1)}
.big{font-family:var(--display);font-size:30px;color:var(--gold2)}
.toastq{position:absolute;top:10px;left:16px;right:16px;z-index:55;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1c150fee;border:1px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;animation:tst 2.6s forwards}
@keyframes tst{0%{transform:translateY(-20px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.help-topic{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const view=$('#view'), app=$('#app');
const rnd=n=>1+Math.floor(Math.random()*n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MEM={};
function store(k,v){if(v===undefined){try{const x=localStorage.getItem(k);if(x)return JSON.parse(x)}catch(e){}return k in MEM?JSON.parse(MEM[k]):null}

function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const BOLT='<svg class="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>';
const bolts=(n,m)=>`<span style="color:var(--en)">${Array.from({length:m},(_,i)=>i<n?BOLT:BOLT.replace('currentColor','#2a3a4a')).join('')}</span>`;

/* ---------- sound ---------- */
let AC=null, muted=!!store('sirdab.mute');
function ac(){if(muted)return null;try{if(!AC||AC.state==='closed')AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume().catch(()=>{});return AC}catch(e){AC=null;return null}}

  if(!unlocked){unlocked=true;try{const s=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');s.setAttribute('playsinline','');s.volume=0.01;s.play().catch(()=>{})}catch(e){}}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
function noise(dur,freq,vol){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur|0),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(OUT(a));s.start()}

const SFX={
  rattle(){noise(.05,2400,.22)}, clack(){noise(.09,1600,.6);setTimeout(()=>noise(.06,2200,.35),70)}, thud(){noise(.12,900,.7)},
  tick(f){tone(f||600,(f||600)*1.02,.05,'square',.04)},
  hit(p){const k=p||1;noise(.18,300*k,.9);tone(140*k,50,.25,'triangle',.4)}, slash(){noise(.15,4000,.5)},
  magic(){tone(300,1400,.5,'sine',.15);tone(450,1800,.6,'triangle',.08)}, heal(){tone(500,900,.4,'sine',.15);setTimeout(()=>tone(700,1200,.4,'sine',.12),120)},
  good(){tone(520,780,.25,'triangle',.1);setTimeout(()=>tone(780,1040,.3,'triangle',.1),140)}, bad(){tone(300,140,.4,'sawtooth',.08)},
  coin(p){const k=p||1;tone(1200*k,1800*k,.1,'square',.05);setTimeout(()=>tone(1600*k,2400*k,.12,'square',.04),70)},
  whisper(){noise(1.2,900,.25);tone(220,180,1.2,'sine',.05)},
  fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,.35,'triangle',.075),i*110));setTimeout(()=>tone(1046,1568,.6,'sine',.055),480)},
  crit(){tone(880,1760,.25,'square',.08);setTimeout(()=>tone(1320,2640,.35,'triangle',.12),90);noise(.3,5000,.3)},
  boom(){noise(.4,180,1);tone(90,40,.5,'sine',.5)},
  chest(){noise(.08,1200,.28);setTimeout(()=>noise(.1,700,.42),120)},
  shimmer(){[1,2,3,4,5,6].forEach(i=>setTimeout(()=>tone(900+i*180,1200+i*200,.25,'sine',.04),i*60))},
  down(){tone(400,90,.7,'sawtooth',.1)}
};

/* ---------- effects ---------- */
function shake(big){app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');if(big)app.style.setProperty('--sk',big)}
function flash(c){const f=$('#flash');f.style.background=c;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function rectOf(el){const a=app.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2,w:r.width,h:r.height}}
function floatAt(el,text,color,cls,size){if(!el)return;const p=rectOf(el),d=document.createElement('div');d.className='float '+(cls||'');d.textContent=String(text).replace(/^([+\-\u2212]\d+)/,'\u2066$1\u2069');d.style.color=color;if(size)d.style.fontSize=size+'px';d.style.left=(p.x-30+(Math.random()*20-10))+'px';d.style.top=(p.y-34)+'px';app.appendChild(d);setTimeout(()=>d.remove(),1200)}
function slashAt(el){if(!el)return;const p=rectOf(el),d=document.createElement('div');d.className='slash';d.style.width=p.w+'px';d.style.left=(p.x-p.w/2)+'px';d.style.top=p.y+'px';app.appendChild(d);setTimeout(()=>d.remove(),400)}
function cls(el,c){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function sizeFx(){const r=app.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;cv.style.width=r.width+'px';cv.style.height=r.height+'px'}
addEventListener('resize',sizeFx);
function burst(fromEl,toEl,color,n){if(!fromEl||!toEl)return;sizeFx();const a=rectOf(fromEl),b=rectOf(toEl);for(let i=0;i<(n||40);i++){parts.push({m:'fly',x:a.x+(Math.random()-.5)*20,y:a.y+(Math.random()-.5)*20,tx:b.x+(Math.random()-.5)*b.w*.5,ty:b.y+(Math.random()-.5)*b.h*.5,t:-i*0.015,c:color,s:2+Math.random()*4})}if(!raf)raf=requestAnimationFrame(tick)}
function pop(el,colors,n){if(!el)return;sizeFx();const a=rectOf(el);for(let i=0;i<(n||36);i++){const ang=Math.random()*Math.PI*2,sp=2+Math.random()*6;parts.push({m:'pop',x:a.x,y:a.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,t:0,c:pick(colors),s:2+Math.random()*4})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){const k=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.t<1.15);for(const p of parts){p.t+=p.m==='pop'?0.022:0.035;if(p.t<0)continue;let x,y;
  if(p.m==='pop'){p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.vx*=.98;x=p.x;y=p.y}else{const t=Math.min(p.t,1),e=t*t*(3-2*t);x=p.x+(p.tx-p.x)*e+Math.sin(t*9+p.s)*12*(1-t);y=p.y+(p.ty-p.y)*e-Math.sin(t*3.14)*40}
  cx.globalAlpha=p.m==='pop'?Math.max(0,1-p.t):(p.t>1?Math.max(0,1-(p.t-1)*7):1);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;cx.beginPath();cx.arc(x*k,y*k,p.s*k,0,7);cx.fill()}
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
function glow(el){cls(el,'glow')}
/* coins fly from one element to a counter and tick it up */
function coinsTo(fromEl,toEl,amount,onTick){return new Promise(res=>{if(!fromEl||!toEl||amount<=0){res();return}
  const n=Math.min(12,Math.max(3,Math.ceil(amount/10))),a=rectOf(fromEl),b=rectOf(toEl);let done=0;const per=amount/n;
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';app.appendChild(c);const sx=a.x+(Math.random()-.5)*40,sy=a.y+(Math.random()-.5)*30;
    const an=c.animate([{transform:`translate(${sx-7}px,${sy-7}px) scale(.4)`},{transform:`translate(${sx-7+(Math.random()-.5)*60}px,${sy-50}px) scale(1.2)`,offset:.3},{transform:`translate(${b.x-7}px,${b.y-7}px) scale(.7)`}],{duration:650+i*60,easing:'cubic-bezier(.5,0,.8,.6)',delay:i*45});
    an.onfinish=()=>{c.remove();done++;SFX.coin(1+done*0.04);if(onTick)onTick(Math.round(per*done));cls(toEl,'glow');if(done===n)res()}}})}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2700)}
/* big gold band across the screen (achievements, level up, victory) */
let bandQ=Promise.resolve(),bandEnd=0,pendRev=0;
/* banners wait while the big chest reveal is open, so they never cover it */
const noReveal=()=>new Promise(r=>{const ck=()=>{const R=$('#reveal');if(pendRev||(R&&!R.classList.contains('hidden')))setTimeout(ck,200);else r()};ck()});
function band(s1,t,s2,o){o=o||{};bandQ=bandQ.then(noReveal).then(()=>new Promise(res=>{const B=$('#band');B.className='';if(o.color)B.classList.add(o.color);
  B.querySelector('.s1').textContent=s1||'';B.querySelector('.t').textContent=t;B.querySelector('.s2').textContent=s2||'';const d=o.dur||2400;bandEnd=Date.now()+d;B.style.setProperty('--bd',d+'ms');
  void B.offsetWidth;B.classList.add('go');if(o.sound!==false)(o.sound||SFX.fanfare)();vib(o.color==='red'?[200]:[40,40,90]);setTimeout(res,d-150)}));return bandQ}

/* ---------- sound 2: mixer, music, ambience and many more effects ---------- */
let musOn=store('sirdab.music')!==false;
/* the two volume sliders in the settings; music starts at 20% so it never bothers anyone */
const vol0=(k,d)=>{const v=store(k);return typeof v==='number'?Math.max(0,Math.min(1,v)):d};
let musVol=vol0('sirdab.musvol',.2),sfxVol=vol0('sirdab.sfxvol',1);
const MUSV=.42,AMBV=.6;   /* the music level at 100% on the slider */
/* the whole game plays at half level, so 100% on the sliders is comfortable on a phone speaker */
const MASTER=.5;
let MIX=null,NB=null;
function mix(){const a=ac();if(!a)return null;if(MIX&&MIX.a===a)return MIX;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;const out=a.createGain();out.gain.value=MASTER;comp.connect(out);out.connect(a.destination);
  const bus=v=>{const g=a.createGain();g.gain.value=v;g.connect(comp);return g};
  /* music and ambience go through a soft filter so they stay warm and never shrill */
  const soft=a.createBiquadFilter();soft.type='lowpass';soft.frequency.value=3200;soft.Q.value=.5;soft.connect(comp);
  const sfx=bus(sfxVol),mus=bus(musOn?MUSV*musVol:0),amb=bus(musOn?AMBV*musVol:0);mus.disconnect();mus.connect(soft);amb.disconnect();amb.connect(soft);
  /* a small echo so the oud and the ney sound like they are in a big dark room */
  const send=a.createGain(),dl=a.createDelay(1),fb=a.createGain(),lp=a.createBiquadFilter();dl.delayTime.value=.27;fb.gain.value=.32;lp.type='lowpass';lp.frequency.value=1800;
  send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mus);
  const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b;
  MIX={a,comp,out,sfx,mus,amb,send,trim:{}};return MIX}
const OUT=a=>{const m=mix();return m?m.sfx:a.destination};
function eg(t,at,peak,d,dest){const g=MIX.a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+d);if(dest)g.connect(dest);return g}
function os(type,f,t,dur,dest,f2,det){const o=MIX.a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
function nz(t,dur,f,vol,dest,o){o=o||{};const a=MIX.a,s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(f,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;const g=eg(t,o.a||.003,vol,dur,dest||MIX.sfx);s.connect(fl);fl.connect(g);s.start(t,Math.random()*1.5);s.stop(t+dur+.1)}
const HZ=n=>146.83*Math.pow(2,n/12);           /* 0 = D3 */
const HIJAZ=[0,1,4,5,7,8,10];                   /* the scale that sounds "Egyptian night" */
const deg=i=>HIJAZ[((i%7)+7)%7]+12*Math.floor(i/7);
let MD=7;function mel(lo,hi){lo=lo==null?4:lo;hi=hi||13;MD+=pick([-2,-1,-1,0,1,1,2]);if(MD<lo)MD=lo+1;if(MD>hi)MD=hi-1;return deg(MD)}

/* instruments */

  if(dest)lp.connect(dest);else{lp.connect(m.mus);lp.connect(m.send)}

  if(dest)g.connect(dest);else{g.connect(m.mus);g.connect(m.send)}
  const o=os('sine',f,t,dur,g);const tg=a.createGain();tg.gain.value=.3;tg.connect(g);const o2=os('triangle',f,t,dur,tg);
  const l=a.createOscillator();l.frequency.value=5.2;const lg=a.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.014,t+dur*.5);l.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);l.start(t);l.stop(t+dur+.05);
  nz(t,dur*.8,f*2,vol*.25,dest||m.mus,{q:2,a:.2})}
function doum(t,v){const g=eg(t,.002,v,.32,MIX.mus);os('sine',130,t,.35,g,45)}
function tak(t,v){nz(t,.06,3200,v,MIX.mus,{q:1.5});const g=eg(t,.001,v*.5,.05,MIX.mus);os('triangle',620,t,.06,g)}
function ka(t,v){nz(t,.035,5000,v,MIX.mus,{q:1})}

function drone(ns,vol,cut,dest){vol*=.6;const a=MIX.a,t=a.currentTime,g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+3);const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut||500;g.connect(lp);lp.connect(dest||MIX.mus);
  const list=ns.map((n,i)=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=HZ(n);o.detune.value=i%2?6:-6;o.connect(g);o.start();return o});
  const l=a.createOscillator();l.frequency.value=.08;const lg=a.createGain();lg.gain.value=(cut||500)*.4;l.connect(lg);lg.connect(lp.frequency);l.start();list.push(l);
  return {stop(){const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);list.forEach(o=>{try{o.stop(t+1.3)}catch(e){}})}}}
function bed(f,q,vol,type,rate,depth){const a=MIX.a,t=a.currentTime,s=a.createBufferSource();s.buffer=NB;s.loop=true;const fl=a.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=f;fl.Q.value=q||.7;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+2.5);s.connect(fl);fl.connect(g);g.connect(MIX.amb);s.start();
  const l=a.createOscillator();l.frequency.value=rate||.1;const lg=a.createGain();lg.gain.value=depth==null?f*.5:depth;l.connect(lg);lg.connect(fl.frequency);l.start();
  return {stop(){const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);s.stop(t+1.3);l.stop(t+1.3)}}}

const MUS={mode:'',cur:null,live:null,next:0,step:0,timer:0};
function musTick(){if(muted||!musOn||!musVol||!MIX||MIX.a!==AC||AC.state!=='running'||!MUS.cur)return;const a=MIX.a,sp=60/MUS.cur.bpm/4;
  if(MUS.next<a.currentTime)MUS.next=a.currentTime+.05;
  while(MUS.next<a.currentTime+.25){try{MUS.cur.step(MUS.step,MUS.next,sp)}catch(e){(window.__sndErr=window.__sndErr||[]).push('mus '+String(e))}MUS.step++;MUS.next+=sp}}
function setMusic(mode){if(mode===MUS.mode&&MUS.live)return;MUS.mode=mode;
  if(MUS.live){MUS.live.forEach(x=>{try{x.stop()}catch(e){}});MUS.live=null}MUS.cur=null;
  if(!AC||muted)return;const m=mix();if(!m)return;const s=SONGS[mode];if(!s)return;
  MUS.cur=s;MUS.step=0;MUS.next=m.a.currentTime+.4;try{MUS.live=s.start?s.start(m):[]}catch(e){MUS.live=[];(window.__sndErr=window.__sndErr||[]).push('start '+String(e))}
  if(!MUS.timer)MUS.timer=setInterval(musTick,60)}
function musicSync(){if(muted||!MUS.mode)return;const md=MUS.mode;MUS.mode='';setMusic(md)}
function busLv(r){const m=AC&&!muted?mix():null;if(!m)return;const t=m.a.currentTime,k=musOn?musVol:0;r=r==null?.4:r;
  [[m.mus,MUSV*k],[m.amb,AMBV*k],[m.sfx,sfxVol]].forEach(([g,lv])=>{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(lv,t+r)})}
function setMusOn(v){musOn=v;store('sirdab.music',v);busLv()}
function setVol(k,v){v=Math.max(0,Math.min(1,v));if(k==='mus'){musVol=v;store('sirdab.musvol',v)}else{sfxVol=v;store('sirdab.sfxvol',v)}busLv(.08)}

/* effort (مجهود): mining and fishing cost it; it comes back with time or food */
const EFF_MAX=20;
function effNow(h){const per=h.hidden.sabr?40000:60000,now=Date.now();if(h.eff.v>=EFF_MAX){h.eff.t=now;return h.eff.v}
  const g=Math.floor((now-h.eff.t)/per);if(g>0){h.eff.v=Math.min(EFF_MAX,h.eff.v+g);h.eff.t+=g*per;if(h.eff.v>=EFF_MAX)h.eff.t=now}return h.eff.v}
function useEff(h){if(effNow(h)<1)return false;if(h.eff.v>=EFF_MAX)h.eff.t=Date.now();h.eff.v--;return true}

function fixHero4(h){
  h.res=h.res||{};h.gear=h.gear||{};h.eq=h.eq||{};h.cnt=h.cnt||{};h.hidden=h.hidden||{};h.titles=h.titles||[];h.title=h.title||null;
  h.life=h.life||{};Object.keys(LIFE).forEach(k=>h.life[k]=h.life[k]||{lvl:1,xp:0});
  h.eff=h.eff||{v:EFF_MAX,t:Date.now()};h.minehp=h.minehp||0;
  FOODS.forEach(k=>h.bag[k]=h.bag[k]||0);
  if(h.bag.amulet>0){h.gear.amulet=1;if(!h.eq.charm)h.eq.charm='amulet';h.bag.amulet=0}
  return h}

function a4blob(x,y,r,i){const n=7,pt=[];for(let j=0;j<n;j++){const a=j*2*Math.PI/n+i,q=r*(1+.2*Math.sin(j*2.3+i*1.7));pt.push([x+q*Math.cos(a),y+q*Math.sin(a)*.86])}
  const m=(a,b)=>`${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)}`;return `M${m(pt[n-1],pt[0])}`+pt.map((p,j)=>` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m(p,pt[(j+1)%n])}`).join('')+'Z'}
function a4cry(x,y,l,a,wd){const r=a*Math.PI/180,dx=Math.cos(r),dy=Math.sin(r),nx=-dy*wd/2,ny=dx*wd/2,P=(t,s)=>`${(x+dx*l*t+nx*s).toFixed(1)} ${(y+dy*l*t+ny*s).toFixed(1)}`;
  return [`M${P(0,-1)} L${P(.74,-1)} L${P(1,0)} L${P(.74,1)} L${P(0,1)}Z`,`M${P(0,0)} L${P(1,0)} L${P(.74,1)} L${P(0,1)}Z`]}

/* ---------- market stock: 2-3 rotating resources, new stock after every adventure ---------- */
function twRestock(h){const pool=[['copper',.85,2,4],['iron',.7,1,3],['silver',.4,1,1],['salskin',.55,1,2],['salfang',.4,1,2],['horn',.25,1,1]].sort(()=>Math.random()-.5);
  const list=pool.filter(p=>Math.random()<p[1]).slice(0,3);for(const p of pool){if(list.length>=2)break;if(!list.includes(p))list.push(p)}
  const out=list.map(([k,,a,b])=>({k,stock:a+Math.floor(Math.random()*(b-a+1))}));if(Math.random()<.4)pick(out).deal=1;
  h.mkt={list:out,fresh:1}}
function twMkt(h){if(!h.mkt||!h.mkt.list)twRestock(h);return h.mkt}
const twMktList=h=>[{k:'cloth',always:1},{k:'bread',always:1}].concat(twMkt(h).list);
/* resources cost a bit more than عم رمضان pays for them, so buying and selling never makes money */
function twMP(h,e){const p=MAT[e.k].p,b0=Math.ceil(p*1.5),d=e.deal?.75:1,f=v=>Math.max(p+1,Math.round(v));return {price:f(b0*twMul(h)*d),base:f(b0*d),was:e.deal?f(b0*twMul(h)):0}}
function twRepNote(h,who,fem,items){const m1=priceMul(h),m2=titlePrice(h),m=m1*m2;if(Math.abs(m-1)<.001)return '';
  const pct=Math.round(Math.abs(m-1)*100),r=REP(h.rep)[0],tot=items.reduce((a,x)=>a+Math.abs(x.price-x.base),0),t=titlesOn(h).find(x=>x.price),tn=t?`«${titleName(t,h)}»`:'';
  if(m>1)return `<div class="repnote bad">سمعتك «${r}»، ف${who} ${fem?'مزوّدة':'مزوّد'} ${G('عليك','عليكي')} <b>${pct}%</b> في كل حاجة.<small>يعني ${G('بتدفع','بتدفعي')} زيادة ${tot} جنيه لو ${G('اشتريت','اشتريتي')} حاجة من كل نوع.${m2<1?` ولقبك ${tn} مخفف الزيادة شوية.`:''} السمعة بتتحسن لما ${G('تساعد','تساعدي')} الناس.</small></div>`;
  return `<div class="repnote good">${m1<1?`سمعتك «${r}»${m2<1?` ولقبك ${tn}`:''}`:`لقبك ${tn}`}، ف${who} ${fem?'مخصمالك':'مخصملك'} <b>${pct}%</b> من كل حاجة.<small>يعني ${G('بتوفّر','بتوفّري')} ${tot} جنيه لو ${G('اشتريت','اشتريتي')} حاجة من كل نوع.</small></div>`}
function twUses(k){const a=[];Object.keys(GEAR).forEach(id=>{const g=GEAR[id];if(g.craft&&g.craft[k])a.push(g.n)});BAGUPS.forEach(b=>{if(b.craft[k])a.push(b.n)});Object.keys(TW_REC).forEach(f=>{if(TW_REC[f].need[k])a.push(ITEMS[f].name)});return a}

/* ---------- what can be made now, and the nearest goal ---------- */
function twCanN(h,at){let n=Object.keys(GEAR).filter(id=>{const g=GEAR[id];return g.at===at&&g.craft&&!(h.gear[id]>0)&&lifeLvl(h,at)>=(g.lv||1)&&hasRes(h,g.craft)&&h.money>=twCm(h,g.cm,at)}).length;
  const b=BAGUPS[h.bagLvl||0];if(at==='tailor'&&b&&lifeLvl(h,'tailor')>=b.lv&&hasRes(h,b.craft)&&h.money>=twCm(h,b.cm,'tailor'))n++;return n}
const twCanCook=(h,k)=>lifeLvl(h,'cook')>=TW_REC[k].lv&&hasRes(h,TW_REC[k].need)&&!bagFull(h,k);
/* nearest thing to make: what costs least to finish (missing stuff at market value + missing money); never something weaker than what you own */
function twGoal(h){const c=[],better=(id,g)=>!Object.keys(GEAR).some(x=>x!==id&&GEAR[x].slot===g.slot&&(h.gear[x]||0)>0&&GEAR[x].tier>g.tier);
  Object.keys(GEAR).forEach(id=>{const g=GEAR[id];if(g.craft&&!(h.gear[id]>0)&&better(id,g))c.push({id,n:g.n,need:g.craft,cm:g.cm,at:g.at,lv:g.lv||1,tier:g.tier})});
  const b=BAGUPS[h.bagLvl||0];if(b)c.push({id:b.id,n:b.n,need:b.craft,cm:b.cm,at:'tailor',lv:b.lv,tier:b.tier});
  c.forEach(x=>{x.miss=twMiss(h,x.need);x.mn=x.miss.reduce((a,m)=>a+m[1],0);x.lock=lifeLvl(h,x.at)<x.lv;x.cost=twCm(h,x.cm,x.at);
    x.sc=x.miss.reduce((a,[k,n])=>a+MAT[k].p*n,0)+Math.max(0,x.cost-h.money)});
  c.sort((a,b)=>(a.lock-b.lock)||(a.sc-b.sc)||(b.tier-a.tier)||(a.lv-b.lv));return c[0]||null}
function twGoalHTML(h){const c=twGoal(h);if(!c)return '';const who=c.at==='smith'?'عم حسن':'عم فتحي',mk=G('وتعمل','وتعملي');let t,s;
  if(!c.mn&&!c.lock&&h.money>=c.cost){t=`${G('معاك','معاكي')} كل حاجة! ${G('روح','روحي')} ل${who} ${G('واعمل','واعملي')} ${c.n}`;s=`${needTxt(c.need)} + ${c.cost} جنيه شغل`}
  else if(!c.mn){t=`فاضلك ${Math.max(0,c.cost-h.money)} جنيه ${mk} ${c.n}`;s=`${who} بياخد ${c.cost} جنيه في الشغل`}
  else{t=`فاضل ${twMissTxt(c.miss)} ${mk} ${c.n}`;s=twSrcTxt(c.miss)}
  if(c.lock)s=`${G('محتاج','محتاجة')} ${LIFE[c.at].n} مستوى ${c.lv}`;
  return `<button class="tw-goal" id="twGoal" data-at="${c.at}"><span class="ic">${twGear(c.id,38)}</span><span class="tx">${t}<small>${s}</small></span><span class="go">‹</span></button>`}

function twSay(h){const hid=Object.keys(HIDDEN).filter(k=>!h.hidden[k]);

function twMktBuy(h,L,pr){return `${twRepNote(h,'عم رمضان',0,pr)}<div class="col">${L.map((e,i)=>{const p=pr[i],m=MAT[e.k],R=RARE[m.tier||0],have=h.res[e.k]||0,out=!e.always&&e.stock<1,uses=twUses(e.k);

      ${uses.length?`<small>بيدخل في: ${uses.slice(0,3).join('، ')}</small>`:''}
      <small>${e.always?'موجود على طول':out?'<span style="color:#f0a090;font-weight:800">خلص</span>':e.stock===1?'<span style="color:#ffb347;font-weight:800">فاضل 1 بس!</span>':`فاضل ${e.stock}`}${have?` · ${G('معاك','معاكي')} ${have}`:''}</small>
      ${p.price!==p.base?`<small class="rx" style="color:${p.price>p.base?'#f0a090':'#a6e3a0'}">${p.price>p.base?`زيادة ${p.price-p.base} جنيه عشان سمعتك`:`خصم ${p.base-p.price} جنيه`}</small>`:''}</div>
      ${twQB('m:'+e.k,twMktMax(h,e,p.price),p.price,p.was,`data-b="${i}"`,`${p.was?`<s>${p.was}</s>`:''}${p.price} جنيه${!out&&h.money<p.price?`<small>ناقصك ${p.price-h.money}</small>`:''}`)}</div>`}).join('')}</div>`}
function twMktSell(h){const res=Object.keys(MAT).filter(k=>(h.res[k]||0)>0),gear=Object.keys(GEAR).filter(id=>twSpare(h,id)>0);
  if(!res.length&&!gear.length)return `<div class="card tw-empty">مفيش حاجة ${G('تبيعها','تبيعيها')} دلوقتي.<br>${G('روح','روحي')} الجبل أو الترعة ${G('وهات','وهاتي')} حاجات، وعم رمضان بيشتري كل حاجة.</div>`;
  const row=k=>{const m=MAT[k],n=h.res[k],R=RARE[m.tier||0];
    if(!m.p)return `<div class="tw-row" style="--rc:${twRc(m.tier||0)}"><div class="ic">${twMat(k,40)}</div><div class="tx"><b>${m.n}</b> <span class="tw-cnt">×${n}</span><small>عم رمضان ضحك: «ده ما يتباعش!»</small></div><button class="tw-buy warn" data-junk="${k}">ارميه</button></div>`;
    return `<div class="tw-row" style="--rc:${twRc(m.tier||0)};flex-wrap:wrap"><div class="ic">${twMat(k,40)}</div><div class="tx"><b style="color:${m.tier?R.c:'var(--ink)'}">${m.n}</b> <span class="tw-cnt">×${n}</span><small>بـ${m.p} جنيه الواحدة</small>${m.tier>=2?`<small style="color:${R.c}">${R.n}. ${G('فكّر','فكّري')} قبل ما ${G('تبيع','تبيعي')}${TW_FEM[k]?'ها':'ه'}</small>`:''}</div>
      ${twSB('sr:'+k,n,m.p,`data-s="${k}"`,k+':')}</div>`};
  const grow=id=>{const g=GEAR[id],R=RARE[g.tier],v=twGearSell(id),sp=twSpare(h,id);
    return `<div class="tw-row" style="--rc:${twRc(g.tier)};flex-wrap:wrap"><div class="ic">${twGear(id,42)}</div><div class="tx"><b style="color:${R.c}">${g.n}</b> <span class="tw-cnt">×${sp}</span><small>${SLOTS[g.slot]} · حتة زيادة مش ${G('لابسها','لابساها')}</small><small>بنص التمن</small></div>${twSB('sg:'+id,sp,v,`data-g="${id}"`,'g:'+id+':')}</div>`};
  const ores=res.filter(k=>!MAT[k].fish),fish=res.filter(k=>MAT[k].fish);
  return `${ores.length?`<div class="tw-lbl">حاجات</div><div class="col">${ores.map(row).join('')}</div>`:''}${fish.length?`<div class="tw-lbl">سمك</div><div class="col">${fish.map(row).join('')}</div>`:''}${gear.length?`<div class="tw-lbl">عدّة زيادة</div><div class="col">${gear.map(grow).join('')}</div>`:''}`}
function twBuyRes(i,btn){const h=S.hero,e=twMktList(h)[i];if(!e)return;const p=twMP(h,e).price,mx=twMktMax(h,e,p);if(mx<1)return;const n=qtyN('m:'+e.k,mx);
  h.money-=p*n;if(!e.always)e.stock-=n;addRes(h,e.k,n);saveHero();floatAt(btn,twI('+'+n)+' '+resN(e.k),'#a6e3a0','',18);twPay(btn,p*n);
  const tr=MAT[e.k].tier||0;if(tr)pop(btn,[RARE[tr].c,'#ffffff',RARE[tr].c],10+tr*8);twRender();
  if(!e.always&&e.stock===0)toast(`آخر ${resN(e.k)} عند عم رمضان بقى ${G('معاك','معاكي')}`)}
function twSellRes(k,btn){const h=S.hero,have=h.res[k]||0;if(have<1)return;const n=qtyN('sr:'+k,have),m=MAT[k],key=k+':'+n;
  if((m.tier||0)>=2&&TWN.conf!==key){TWN.conf=key;SFX.meh();return twRender()}
  TWN.conf=null;const v=m.p*n;h.res[k]-=n;h.money+=v;saveHero();SFX.reg();floatAt(btn,twI('+'+v)+' جنيه','#f3d48f','',20);twMoneyFly(btn,v);twRender();if(h.money>=500)ach('rich')}
function twSellGear(id,btn){const h=S.hero,sp=twSpare(h,id);if(sp<1)return;const n=qtyN('sg:'+id,sp),key='g:'+id+':'+n;if(TWN.conf!==key){TWN.conf=key;SFX.meh();return twRender()}
  TWN.conf=null;const v=twGearSell(id)*n;h.gear[id]-=n;h.money+=v;saveHero();SFX.reg();floatAt(btn,twI('+'+v)+' جنيه','#f3d48f','',20);twMoneyFly(btn,v);twRender();if(h.money>=500)ach('rich')}
function twJunk(k,btn){const h=S.hero;if(!(h.res[k]>0))return;h.res[k]=0;saveHero();SFX.whoosh();floatAt(btn,'طششش!','#9fc6ee','',22);toast(`عم رمضان رمى ${resN(k)} في الترعة تاني: «يمكن حد غيرك يصطاده!»`);twRender()}

/* ---------- الحداد / الخياط ---------- */
function twWork(at){const h=S.hero;if(!h){S.screen='title';return render()}
  const npc=at==='smith'?'hassan':'fathy',who=at==='smith'?'عم حسن':'عم فتحي';
  const ids=Object.keys(GEAR).filter(id=>GEAR[id].at===at).sort((a,b)=>((GEAR[a].lv||1)-(GEAR[b].lv||1))||(TW_SLOTS.indexOf(GEAR[a].slot)-TW_SLOTS.indexOf(GEAR[b].slot))||(GEAR[a].tier-GEAR[b].tier));
  const slots=TW_SLOTS.filter(s=>ids.some(id=>GEAR[id].slot===s)),f=slots.includes(TWN.fil)?TWN.fil:'all',shown=ids.filter(id=>f==='all'||GEAR[id].slot===f);
  const pr=ids.filter(id=>GEAR[id].buy).map(id=>({price:twGP(h,GEAR[id].buy),base:Math.round(GEAR[id].buy/5)*5})).concat(at==='smith'?TW_SMAT.map(k=>twSmP(h,k)):[]);
  view.innerHTML=`${twTop(at==='smith'?'الحداد':'الخياط')}<div class="tw">
    ${twNpcHTML(npc,twGreetC(h,npc))}
    ${twLifeHTML(h,at)}
    <div class="tw-stk">${slots.length>2?`<div class="tw-fil">${['all'].concat(slots).map(s=>`<button data-f="${s}" class="${f===s?'on':''}">${s==='all'?'الكل':SLOTS[s]}</button>`).join('')}</div>`:''}<div class="tw-wal"><span>${G('اشتري','اشتري')} جاهز، أو ${G('اعمل','اعملي')} بإيدك بأرخص</span>${twMon(h)}</div></div>
    ${twRepNote(h,who,0,pr)}${twMul(h)>1?`<div class="tw-sm" style="margin-top:-12px">ولو ${G('عملت','عملتي')} الحاجة بإيدك، تمن الشغل مش بيتأثر بسمعتك.</div>`:''}
    ${at==='tailor'?twBagHTML(h):''}
    ${at==='tailor'?`<div class="tw-lbl">هدوم</div>`:''}
    <div class="col">${shown.map(id=>twGearCard(h,id)).join('')}</div>
    ${at==='smith'?twSmHTML(h):''}</div>`;
  twBack();
  view.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{TWN.fil=b.dataset.f;twRender()});
  view.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>twBuyGear(b.dataset.buy,b));
  view.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>twCraft(b.dataset.cr,b));
  view.querySelectorAll('[data-bag]').forEach(b=>b.onclick=()=>twBag(b.dataset.bag,b));
  view.querySelectorAll('[data-xm]').forEach(b=>b.onclick=()=>twBuyMetal(b.dataset.xm,b));qtyBind()}
SCREENS.smith=()=>twWork('smith');SCREENS.tailor=()=>twWork('tailor');
function twLifeHTML(h,k){const L=h.life[k],nd=L.lvl*4,mx=L.lvl>=10,disc=k==='smith'||k==='tailor'?Math.round(Math.min(.5,.1*(L.lvl-1))*100):0;
  const how={smith:`كل حاجة ${G('بتعملها','بتعمليها')} بإيدك بتعلّمك`,tailor:`كل حاجة ${G('بتعملها','بتعمليها')} بإيدك بتعلّمك`,cook:`كل أكلة ${G('بتطبخها','بتطبخيها')} بتعلّمك`}[k]||'';
  return `<div class="card tw-life"><div class="r1"><b>${LIFE[k].n} <span>مستوى ${L.lvl}</span></b>${disc?`<span class="tw-ch up">الشغل أرخص ${disc}%</span>`:''}</div>
    <div class="tw-bar lf"><i style="width:${mx?100:L.xp/nd*100}%"></i></div>
    <div class="tw-sm">${mx?G('وصلت لآخر مستوى','وصلتي لآخر مستوى'):`فاضلك <b>${nd-L.xp}</b> خبرة ${G('وتطلع','وتطلعي')} ${LIFE[k].n} مستوى ${L.lvl+1}`}. ${how}.<br>${T(LIFE[k].d)}.</div></div>`}
function twGearCard(h,id){const g=GEAR[id],R=RARE[g.tier],own=h.gear[id]||0,on=h.eq[g.slot]===id,at=g.at,lv=g.lv||1;
  const lock=g.craft&&lifeLvl(h,at)<lv,cost=g.craft?twCm(h,g.cm,at):0,miss=g.craft?twMiss(h,g.craft):[],bp=g.buy?twGP(h,g.buy):0;
  const canB=g.buy&&h.money>=bp,canC=g.craft&&!lock&&!miss.length&&h.money>=cost;
  const buyB=g.buy?`<button class="tw-act by" data-buy="${id}" ${canB?'':'disabled'}><b>اشتري جاهز</b><small>${bp} جنيه${canB?'':` · ناقصك ${bp-h.money}`}</small></button>`:`<div class="tw-na">مش بيتباع جاهز.<br>لازم ${TW_FEMG[id]?'تتعمل':'يتعمل'} بالإيد</div>`;
  const crB=!g.craft?'':lock?`<button class="tw-act lk" disabled><b>${TW_LOCK}${twV(id,'اعمل')} بإيدك</b><small>${G('محتاج','محتاجة')} ${LIFE[at].n} مستوى ${lv}</small></button>`
    :`<button class="tw-act cr" data-cr="${id}" ${canC?'':'disabled'}><b>${twV(id,'اعمل')} بإيدك</b><small>${needTxt(g.craft)} + ${cost} جنيه</small></button>`;
  let note='';if(g.craft&&!lock){const mm=[];if(miss.length)mm.push(twMissTxt(miss));if(h.money<cost)mm.push(`${cost-h.money} جنيه`);
    note=mm.length?`<div class="tw-miss">ناقصك ${mm.join(' و')}${miss.length?` · ${twSrcTxt(miss)}`:''}</div>`:`<div class="tw-miss ok">${G('معاك','معاكي')} كل الحاجات، ${G('تقدر تعمل','تقدري تعملي')}${twObj(id)} دلوقتي!</div>`}
  return `<div class="tw-it${own?' got':''}" style="--rc:${twRc(g.tier)}"><div class="hd"><div class="ic">${twGear(id,46)}</div><div class="tx">
      <div class="nmr"><b style="color:${R.c}">${g.n}</b><span class="tw-rn" style="color:${R.c}">${R.n}</span>${own?`<span class="tw-own">${G('معاك','معاكي')}${own>1?' ×'+own:''}</span>`:''}${on?`<span class="tw-on">${g.slot==='weapon'?'في إيدك':G('عليك','عليكي')}</span>`:''}</div>
      <div class="tw-chs"><span class="tw-ch">${SLOTS[g.slot]}</span>${twChips(twGStats(g))}</div>${twInfo(g)?`<small>${twInfo(g)}</small>`:''}</div></div>
    ${g.buy||g.craft?`<div class="tw-two">${g.craft?buyB+crB:buyB.replace('tw-act by','tw-act by wide')}</div>`:''}${note}</div>`}
async function twBuyGear(id,btn){const h=S.hero,g=GEAR[id];if(TWN.busy||!g||!g.buy)return;const p=twGP(h,g.buy);if(h.money<p)return;
  TWN.busy=1;h.money-=p;h.gear[id]=(h.gear[id]||0)+1;saveHero();twPay(btn,p,1);
  const r=await twCeremony({kind:'buy',tier:g.tier,icon:twGear(id,124),title:g.n,sub:`${twDid('اشتريت',id)} جاهز بـ${p} جنيه`,chips:twChips(twGStats(g)),snd:SFX.bell,acts:twEqActs(h,id)});
  TWN.busy=0;if(r==='eq')twEquip(id,true);twRender()}
function twEqActs(h,id){const g=GEAR[id];return h.eq[g.slot]===id?[{v:'ok',t:'تمام'}]:[{v:'eq',t:twV(id,twWear(id))+' دلوقتي'},{v:'no',t:'بعدين',g:1}]}
async function twCraft(id,btn){const h=S.hero,g=GEAR[id];if(TWN.busy||!g||!g.craft)return;const at=g.at,cost=twCm(h,g.cm,at);
  if(lifeLvl(h,at)<(g.lv||1)||!hasRes(h,g.craft)||h.money<cost)return;
  TWN.busy=1;takeRes(h,g.craft);h.money-=cost;h.gear[id]=(h.gear[id]||0)+1;saveHero();twPay(btn,cost);
  const r=await twCeremony({kind:at,tier:g.tier,icon:twGear(id,124),title:g.n,sub:`${twDid('عملت',id)} بإيدك!`,chips:twChips(twGStats(g)),acts:twEqActs(h,id),
    msg:`${G('دوس','دوسي')} ${at==='smith'?G('واطرق','واطرقي'):G('وخيّط','وخيّطي')}!`});
  TWN.busy=0;lifeXP(h,at,1+g.tier);bump('crafted');if(r==='eq')twEquip(id,true);saveHero();twRender()}

function twBagCard(h,b,i){const L=h.bagLvl||0,R=RARE[b.tier],chips=Object.keys(b.add).map(k=>`<span class="tw-ch up">${twN(b.add[k])} ${TW_BAGK[k][1]}</span>`).join('');

    ${lock?'':mm.length?`<div class="tw-miss">ناقصك ${mm.join(' و')}${miss.length?` · ${twSrcTxt(miss)}`:''}</div>`:`<div class="tw-miss ok">${G('معاك','معاكي')} كل الحاجات!</div>`}</div>`}
async function twBag(mode,btn){const h=S.hero,L=h.bagLvl||0,b=BAGUPS[L];if(TWN.busy||!b)return;let cost;

/* v4.1: خامات at عم حسن: dearer than the mountain and the market, but always there */

const twSmMax=(h,p)=>qtyMax(99,h.money/p);
function twSmHTML(h){return `<div class="tw-lbl">خامات <small>أغلى من الجبل والسوق، بس جاهزة على طول</small></div><div class="col">${TW_SMAT.map(k=>twSmRow(h,k)).join('')}</div>`}
function twSmRow(h,k){const m=MAT[k],R=RARE[m.tier||0],p=twSmP(h,k),have=h.res[k]||0,uses=twUses(k);

      <small>${TW_FEM[k]?'موجودة':'موجود'} على طول${have?` · ${G('معاك','معاكي')} ${have}`:''}</small>
      ${p.price!==p.base?`<small class="rx" style="color:${p.price>p.base?'#f0a090':'#a6e3a0'}">${p.price>p.base?`زيادة ${p.price-p.base} جنيه عشان سمعتك`:`خصم ${p.base-p.price} جنيه`}</small>`:''}</div>
    ${twQB('x:'+k,twSmMax(h,p.price),p.price,0,`data-xm="${k}"`,`${p.price} جنيه${h.money<p.price?`<small>ناقصك ${p.price-h.money}</small>`:''}`)}</div>`}

const TW_MAIN={weapon:g=>[g.dmg||0],armor:g=>[g.armor||0],head:g=>[g.armor||0,g.hp||0]};
function twBetter(h,s){const id=h.eq[s],cur=id&&GEAR[id],own=Object.keys(GEAR).filter(x=>GEAR[x].slot===s&&x!==id&&(h.gear[x]||0)>0);
  if(!own.length)return false;if(!cur)return true;const f=TW_MAIN[s];if(!f)return false;const c=f(cur);
  return own.some(x=>{const v=f(GEAR[x]);for(let i=0;i<v.length;i++)if(v[i]!==c[i])return v[i]>c[i];return false})}

  app.appendChild(d);d.querySelector('.bk').onclick=twSheetX;d.querySelector('[data-x]').onclick=twSheetX;

function fsAbort(){fsCommit();if(FS.ph==='cast'||FS.ph==='wait'||FS.ph==='bite'){const h=S.hero;if(h){h.eff.v=Math.min(EFF_MAX,h.eff.v+1);saveHero()}}FS.tok++;FS.ph='idle'}
async function fsCast(){const h=S.hero;if(FS.ph!=='idle'&&FS.ph!=='done')return;fsHideCard();
  if(!useEff(h)){gxTired();fsBtn();return}
  saveHero();gxSpent();FS.n++;const tok=++FS.tok;fsPh('cast');SFX.cast();vib(15);fsSay('هوب!');
  FS.b={m:'fly',t0:performance.now(),d:560,x0:FS.bx,y0:FS.by,arc:110};
  await sleep(560);if(tok!==FS.tok)return;
  SFX.splash(.7);fsRipple(2,1);pop(fsBobEl(),SPL,12);FS.dv+=3;
  fsPh('wait');fsSay(`${G('استنى','استني')}.. لما العوامة تغطس جامد ${G('شد','شدي')}`);
  await bandsDone();if(tok!==FS.tok)return;
  const wait=1500+Math.random()*3500,nn=Math.floor(Math.random()*4),ts=Array.from({length:nn},()=>400+Math.random()*(wait-900)).sort((a,b)=>a-b);let t=0;
  for(const x of ts){await sleep(x-t);t=x;if(tok!==FS.tok)return;FS.dv+=2.4;SFX.plop(.45);fsRipple(1);vib(8);if(Math.random()<.6)fsSay(T(pick(NIB)))}
  await sleep(wait-t);if(tok!==FS.tok)return;
  fsPh('bite');FS.biteAt=performance.now();FS.dipT=17;FS.dv+=7;FS.bendT=1;SFX.bite();vib([70,30,70]);fsRipple(3,1);pop(fsBobEl(),SPL,18);fsSay(G('شد!!','شدي!!'),'bite');
  await sleep(fsWin(h));if(tok!==FS.tok)return;
  fsFail('late')}
function fsTap(){if(FS.ph==='wait'){if(bandBusy()){fsSay(T('لسه.. ما {تشدش|تشديش}'));FS.dv+=1;return}fsFail('early')}else if(FS.ph==='bite')fsHook()}
function fsFail(why){const tok=++FS.tok;fsPh('fail');FS.dipT=0;FS.bendT=0;FS.dv-=4;vib(60);fsRipple(1);
  if(why==='early'){SFX.miss();fsSay(T('{استعجلت|استعجلتي}، السمكة هربت'),'bad');gxSay('fish',SAYX.early,.5)}
  else{SFX.aww();fsSay('السمكة أكلت الطُعم وهربت','bad');gxSay('fish',SAYX.late,.5)}
  setTimeout(()=>{if(tok!==FS.tok)return;FS.b={m:'reel',t0:performance.now(),d:650,x0:FS.bx,y0:FS.by,arc:30};SFX.reel(.5)},450);
  setTimeout(()=>{if(tok===FS.tok)fsPh('idle')},1150)}
function fsHook(){fsCommit();const h=S.hero,V=gxVisit('fish'),tok=++FS.tok,rt=performance.now()-FS.biteAt;
  const k=rollFish(h),M=MAT[k],t=tierOf(k),xp=1+t,first=!M.junk&&!(h.cnt.fish||0);
  addRes(h,k,1);V.n[k]=(V.n[k]||0)+1;saveHero();
  fsPh('reel');SFX.reel();vib([20,20,20]);FS.dipT=0;FS.dv-=6;FS.bendT=1.3;fsRipple(2,1);pop(fsBobEl(),SPL,16);
  fsSay(`${G('شدّيت','شدّيتي')}! ردّ فعلك ${(rt/1000).toFixed(2)} ثانية`,'good');
  FS.b={m:'reel',t0:performance.now(),d:600,x0:FS.bx,y0:FS.by,arc:50};
  /* the fish is saved now; xp, counters, titles and achievements are committed once: when the card is
     put away, on the next cast, on leaving, or 1.6 s after the card, so their bands never hide the card */
  FS.pend=()=>{
    if(k==='goldfish')band(RARE[3].n,'سمكة دهب!','الصيادين بيحكوا عنها.. ومحدش شافها',{dur:2800,sound:()=>{SFX.shimmer();setTimeout(SFX.fanfare,300)}});
    const up=lifeXP(h,'fish',xp);bump(M.junk?'shoes':'fish');
    if(M.junk)ach('f_shoe');else{ach('f_first');if(k==='goldfish')ach('f_gold')}
    saveHero();
    if(S.screen==='fish'&&S.hero===h&&$('#gxXp')){xpUI('fish',up);floatAt($('#gxLvRow'),`${num(xp,'+')} خبرة`,'#f3d48f','',18);fsGoal()}};
  setTimeout(()=>{
    if(tok!==FS.tok||S.screen!=='fish'||!$('#fshCard'))return fsCommit();
    FS.bendT=0;fsCard(k,xp,first);if(k==='goldfish'){flash('#f3c14d');shake()}fsGoal();fsPh('done');
    const f=FS.pend;setTimeout(()=>{if(FS.pend===f)fsCommit()},1600)},600)}
function fsCard(k,xp,first){const M=MAT[k],t=tierOf(k),R=RARE[t],w=$('#fshCard'),junk=M.junk;
  w.innerHTML=`<div class="fsh-card${junk?' wig':''}" style="--rc:${junk?'#9a8a78':R.c}">${t?'<div class="rays"></div>':''}<div class="ic">${AR.fish(k,170)}</div><div class="rn">${junk?'كركبة':R.n}</div><div class="nm">${M.n}</div><div class="sub">${junk?'مالوش تمن':`التمن ${M.p} جنيه`} · ${num(xp,'+')} خبرة صيد</div></div>`;
  const c=w.firstChild;
  if(junk){SFX.meh();fsSay('طلعلك شبشب قديم.. مبروك؟');gxSay('fish',SAYX.shoe)}
  else{SFX.catch(t);SFX.splash(.5);fsSay(`${G('اصطدت','اصطدتي')} ${M.n}!`,'good');pop(c,[R.c,'#ffffff'],t>=2?60:22);if(k==='goldfish')gxSay('fish',SAYX.gold);else if(first)gxSay('fish',SAYX.firstFish);else if(k==='bouri')gxSay('fish',SAYX.bouri,.7);else gxSay('fish',null,.2)}
  setTimeout(()=>{const ic=c.isConnected&&c.querySelector('.ic'),st=$('#gxStage');gxFly(ic?rectOf(ic):st&&rectOf(st),k,0)},750)}
SCREENS.fish=function(){const h=S.hero;if(!h){S.screen='title';return render()}
  fsAbort();const V=gxVisit('fish'),sc=AR.scene();
  view.innerHTML=`${gxTop('الترعة')}${gxStats('fish')}
  <div class="gx-stage fsh-stage" id="gxStage" data-ph="idle"><div class="bg">${sc}</div><div class="fsh-ov">${fsOverlay()}</div><div class="fsh-say" id="fshSay"></div><div class="fsh-cardw" id="fshCard"></div><div class="gx-msg" id="gxMsg"></div></div>
  <button class="btn gx-btn" id="gxGo"></button>
  <div class="gx-lbl"><span>سمك المرة دي</span><span id="gxWorth"></span></div>${gxChips(FISH_K,V)}
  <div class="gx-goal" id="gxGoal"></div>${gxNpcHTML('fish')}`;
  FS.b={m:'hang'};FS.dip=FS.dv=FS.dipT=FS.bend=FS.bendT=0;FS.n=0;
  fsSay(`${G('دوس','دوسي')} «ارمي السنارة» ${G('واستنى','واستني')} العوامة تغطس`);fsBtn();fsGoal();gxBind('fish');
  if(!FS.raf)FS.raf=requestAnimationFrame(fsLoop);
  const st=$('#gxStage'),go=$('#gxGo'),hot=()=>FS.ph==='wait'||FS.ph==='bite';
  st.addEventListener('pointerdown',e=>{if(e.button)return;FS.down=FS.ph;if(hot()&&!$('#gxMsg.on'))fsTap()});
  st.addEventListener('click',()=>{if(gxMsgOff())return;const d=FS.down;FS.down='';if(FS.ph==='done'&&d==='done'){fsHideCard(true);fsPh('idle')}else if(FS.ph==='idle'&&d==='idle')fsCast()});
  go.addEventListener('pointerdown',e=>{if(e.button)return;FS.gdown=FS.ph;if(hot())fsTap()});
  go.addEventListener('click',e=>{const d=FS.gdown;FS.gdown='';if(hot()){if(e.detail===0)fsTap();return}if(d==='wait'||d==='bite')return;gxMsgOff();if(FS.ph==='done'||FS.ph==='idle')fsCast()});
};

/* status effects: foe.fx {skip,poison,weak}, S.combat.me {taunt,smoke,shield,regen}, S.combat.cp {cheer,regen} */
const FXD={
  skip:{c:'#ffd36a',i:'skip'},ice:{c:'#9fe0ff',i:'freeze'},daze:{c:'#c3b2ff',i:'daze'},poison:{c:'#8fe07a',i:'venom'},weak:{c:'#ffd36a',i:'weak'},
  taunt:{c:'#ff9a6a',i:'warcry'},smoke:{c:'#cfc8c0',i:'smoke'},shield:{c:'#8cc4ff',i:'shield'},cheer:{c:'#f3c14d',i:'cheer'},
  regen:{c:'#a6e3a0',i:'regen'},guard:{c:'#cfc6b8',i:'guard'},rage:{c:'#ff7a5a',i:'rage'},thabat:{c:'#cdd6de',i:'thabat'}};
function fxOn(o,k,v){o[k]=Object.assign({t:Date.now()},v||{})}
function fxChips(L){return L.length?`<div class="fxs">${L.map(([k,txt,n,t])=>{const d=FXD[k];
  return `<span class="fxc${k==='daze'?' dz':''}${t&&Date.now()-t<700?' new':''}" style="color:${d.c};border-color:${d.c}77;background:${d.c}1c">${skIco(d.i,13)}${txt}${n>1?`<em>×${n}</em>`:''}</span>`}).join('')}</div>`:''}
function foeChips(f){const x=f.fx||{},L=[];
  if(x.skip)L.push(x.skip.ice?['ice',FF(f,'متجمّد','متجمّدة'),x.skip.n,x.skip.t]:x.skip.daze?['daze',FF(f,'مدروخ','مدروخة'),x.skip.n,x.skip.t]:['skip',FF(f,'متلخبط','متلخبطة'),x.skip.n,x.skip.t]);
  if(x.poison)L.push(['poison',FF(f,'مسموم','مسمومة'),x.poison.n,x.poison.t]);
  if(x.weak)L.push(['weak',FF(f,'مدوّخ','مدوّخة'),0,x.weak.t]);
  return fxChips(L)}
const rageOn=h=>hasSkill(h,'rage')&&h.hp>0&&h.hp<MXH(h)/2;
const thb=h=>h.hidden&&h.hidden.thabat&&h.hp>0&&h.hp<=MXH(h)/3?2:0;
function meChips(){const C=S.combat,h=S.hero,m=C.me,L=[];
  if(C.guard)L.push(['guard',G('مستخبي','مستخبية'),0,0]);
  if(m.taunt)L.push(['taunt',`كلهم ${G('عليك','عليكي')}`,0,m.taunt.t]);
  if(m.smoke)L.push(['smoke','دخان',0,m.smoke.t]);
  if(m.shield)L.push(['shield','درع',0,m.shield.t]);
  if(m.regen)L.push(['regen','+3',m.regen.n,m.regen.t]);
  if(rageOn(h))L.push(['rage','غضب ×3',0,0]);
  if(thb(h))L.push(['thabat','ثبات +2',0,0]);
  return fxChips(L)}
function compChips(){const C=S.combat,p=C.cp,L=[];
  if(p.cheer)L.push(['cheer',`${CG('متشجع','متشجعة')} +2`,0,p.cheer.t]);
  if(p.regen)L.push(['regen','+3',p.regen.n,p.regen.t]);
  return fxChips(L)}

/* the «قدرات» sheet */
const skTgt=s=>!!s.tgt||(s.id==='sp'&&(S.hero.cls==='حرامي'||S.hero.cls==='ساحر'));
const pickOk=(pk,f)=>f.hp>0&&(pk!=='sk:snatch'||!f.snatched);
function skState(s){const C=S.combat,h=S.hero,c=S.comp;if(h.lvl<s.lv)return {lock:1};if(s.pass)return {pas:1};
  const free=!!(C.free&&!C.freeUsed),cost=free?0:s.cost;let why='';
  if(h.energy<cost)why=h.energy<1?'خلصت طاقتك':'طاقتك مش كفاية';
  else if(s.id==='cheer'&&c.hp<=0)why=`${c.name} ${CG('واقع','واقعة')}`;
  else if(s.id==='raise'&&c.hp>0)why=`${c.name} ${CG('واقف','واقفة')} على ${CG('رجليه','رجليها')}`;
  else if(s.id==='cheer'&&C.cp.cheer||(s.id==='smoke'||s.id==='shield')&&C.me[s.id]||s.id==='mass'&&(C.me.regen||C.cp.regen))why='شغال دلوقتي';
  else if(s.id==='snatch'&&!C.foes.some(f=>f.hp>0&&!f.snatched))why=T('{خطفت|خطفتي} من الكل');
  return {ok:!why,why,cost,free}}
function skSheet(){const C=S.combat,h=S.hero;
  return `<div class="sheet sks"><div class="h"><span>القدرات · ${G('اختار','اختاري')} قدرة</span><span>${bolts(h.energy,MXE(h))}</span></div>
  ${C.free&&!C.freeUsed?`<div class="frn">${skIco('free',16)} عصاية الفيروز: أول قدرة في القتال ده ببلاش</div>`:''}
  ${skillsOf(h).map(s=>{const q=skState(s),ic=`<span class="ic">${skIco(q.lock?'lock':skIcoOf(s),q.lock?22:26)}</span>`;
    if(q.lock)return `<div class="it sk lock" disabled>${ic}<span class="tx"><b>${s.n}</b><small>${skTxt(s.d)}</small><small class="lk">${skIco('lock',12)} بتتفتح في المستوى ${s.lv}</small></span></div>`;
    if(q.pas){const on=s.id==='rage'&&rageOn(h);return `<div class="it sk pas" disabled>${ic}<span class="tx"><b>${s.n}</b><small>${skTxt(s.d)}</small></span><span class="pt${on?' on':''}">${on?'شغال دلوقتي':'على طول'}</span></div>`}
    return `<button class="it sk" data-s="${s.id}" ${q.ok?'':'disabled'}>${ic}<span class="tx"><b>${s.n}</b><small>${skTxt(s.d)}${s.roll?` · بتعتمد على ${s.roll}`:''}</small>${q.why?`<small class="why">${q.why}</small>`:''}</span><span class="ec${q.free?' fr':''}">${q.free?'ببلاش':BOLT+' '+s.cost}</span></button>`}).join('')}
  <button class="btn ghost small" id="bagX">رجوع</button></div>`}

/* using a skill: pick a foe if needed, roll its stat, pay the energy, then the effect */
async function useSkill(id,chosen){
  const C=S.combat,h=S.hero;if(!C||C.busy||C.phase!=='me')return;
  const s=skillsOf(h).find(x=>x.id===id);if(!s)return;const q=skState(s);if(!q.ok)return;ac();
  const tg=skTgt(s),alive=C.foes.filter(f=>pickOk('sk:'+id,f));if(tg&&!alive.length)return;
  if(tg&&alive.length>1&&!chosen){C.bag=null;C.picking='sk:'+id;return combat()}
  C.bag=null;C.picking=null;if(tg&&alive.length===1)C.tgt=alive[0].id;
  if(!C.foes[C.tgt]||C.foes[C.tgt].hp<=0){const a=C.foes.find(f=>f.hp>0);if(a)C.tgt=a.id}
  const f=C.foes[C.tgt];let r={tier:'full'};
  /* the roll is as hard as the foe's defence (the toughest living foe for moves that hit them all); the healer's prayer has none */
  const heal=s.id==='sp'&&h.cls==='معالج',dc=heal?0:tg?(f.def||0):Math.max(0,...C.foes.filter(x=>x.hp>0).map(x=>x.def||0));
  if(s.roll){combat();r=await rollCheck(s.roll,{label:`${s.n}${tg?' على '+f.name:''}`,cancel:true,dc});if(r.cancel){combat();return}}
  C.busy=true;
  if(q.free){C.freeUsed=1;C.log.push({t:'عصاية الفيروز: القدرة دي ببلاش.',k:'good'})}else h.energy-=s.cost;
  combat();await sleep(200);if(q.free)floatAt($('#meCard'),'ببلاش!','#7fe0d8','',22);
  if(!s.roll){SFX.skill();floatAt($('#meCard'),s.n,'#f3d48f','',22)}
  C.preSkip=!!(f&&f.fx&&f.fx.skip);await skillAct(s,f,r);
  saveHero();
  if(r.crit)await bonusHit();
  await afterHero();
}
async function skScratch(f,s){const C=S.combat,e=f&&f.hp>0?f:C.foes.find(x=>x.hp>0);if(!e||C.preSkip)return;hurtMe(1);
  await say(`${s.n} نفعت، بس ${e.name} ${FF(e,'لحق','لحقت')} ${FF(e,'يخربشك','تخربشك')}: -1 صحة.`,'bad')}
function poisonFoe(f,d,n){const p=f.fx.poison;fxOn(f.fx,'poison',{d:Math.max(d,p?p.d:0),n:Math.max(n,p?p.n:0)})}
async function skillAct(s,f,r){
  const C=S.combat,h=S.hero,c=S.comp,id=s.id,me=$('#meCard'),fe=()=>$('#foe'+f.id),miss=async t=>{if(id!=='snatch')C.combo=0;SFX.miss();await say(t,'bad')};
  if(id==='sp'){if(h.cls==='معالج')return healAct(r,s.n);if(h.cls==='محارب')return spinAct(r,s.n);return strike(f,r,'sp',s.n)}
  if(id==='warcry'){fxOn(C.me,'taunt');SFX.warcry();shake();floatAt(me,'صرخة حرب!','#ff9a6a','crit',30);C.foes.filter(x=>x.hp>0).forEach(x=>cls($('#foe'+x.id),'hit'));
    return say(`${esc(h.name)} ${G('زعّق','زعّقت')} صرخة حرب! الأعداء كلهم هيضربوا ${G('فيه','فيها')} الدور ده، وضربهم أخف 1.`,'good')}
  if(id==='smoke'){fxOn(C.me,'smoke');SFX.smoke();pop(me,['#bdb6ae','#8a847c','#e6e0d8'],34);
    return say(`${esc(h.name)} ${G('رمى','رمت')} دخان حوالي${G('ه','ها')}. الضربة الجاية ${G('عليه','عليها')} مش هتيجي.`,'good')}
  if(id==='shield'){fxOn(C.me,'shield');SFX.shieldUp();glow(me);pop(me,['#8cc4ff','#cfe9ff'],28);
    return say(`درع سحري نوّر حوالين ${esc(h.name)}. أول ضربة تيجي ${G('فيه','فيها')} هتتمص كلها.`,'good')}
  if(id==='cheer'){fxOn(C.cp,'cheer');SFX.cheer();combat();burst($('#meCard'),$('#compCard'),'#f3c14d',26);glow($('#compCard'));
    return say(`${esc(h.name)} ${G('شجّع','شجّعت')} ${c.name}: ضربت${CG('ه','ها')} الجاية هتيجي أكيد و+2.`,'good')}
  if(id==='raise'){c.hp=Math.ceil(c.max/2);SFX.revive();combat();burst($('#meCard'),$('#compCard'),'#bfffb8',40);healFx($('#compCard'),c.hp);flash('#a6e3a0');
    return say(`${esc(h.name)} ${G('صحّى','صحّت')} ${c.name}! ${CG('قام','قامت')} بنص صحت${CG('ه','ها')}.`,'good')}
  if(id==='mass'){fxOn(C.me,'regen',{n:3});if(c.hp>0)fxOn(C.cp,'regen',{n:3});SFX.regen();combat();pop($('#meCard'),['#a6e3a0','#e9ffe6'],26);if(c.hp>0)pop($('#compCard'),['#a6e3a0','#e9ffe6'],26);
    return say(`نور أخضر نزل على ${esc(h.name)}${c.hp>0?` و${c.name}`:''}: +3 صحة كل دور لمدة 3 أدوار.`,'good')}
  if(id==='bolt'||id==='storm')return aoeAct(s,r);
  if(id==='bash'){if(r.tier==='fail')return miss(`${s.n} ما جتش في ${f.name}.`);
    let d=rnd(3)+WDMG(h)+thb(h);if(r.crit)d*=2;C.combo++;if(S.run)S.run.maxCombo=Math.max(S.run.maxCombo,C.combo);
    SFX.bash();hurtFoe(f,d,{crit:r.crit});await sleep(560);if(f.hp>0){fxOn(f.fx,'skip',{n:1});SFX.stun();floatAt(fe(),FF(f,'اتلخبط!','اتلخبطت!'),'#ffd36a','',22)}
    if(C.combo>=2)comboAt(C.combo);if(C.combo===3)ach('combo');
    await say(`${r.crit?'ضربة حظ! ':''}${s.n} جت في ${f.name}: -${d}${f.hp<=0?` · ${f.name} ${FF(f,'وقع','وقعت')}!`:` · ${FF(f,'هيفوّت دوره','هتفوّت دورها')} الجاي`}`,'good');
    if(r.tier==='part')await skScratch(f,s);return}
  if(id==='venom'){if(r.tier==='fail')return miss(`السم ما لحقش يدخل في ${f.name}.`);
    poisonFoe(f,2,3);SFX.venom();burst(me,fe(),'#7fe06a',26);await sleep(520);cls(fe(),'hit');floatAt(fe(),FF(f,'اتسمم!','اتسممت!'),'#9be07a','',24);
    await say(`${f.name} ${FF(f,'اتسمم','اتسممت')}: ${FF(f,'هيخسر','هتخسر')} 2 صحة كل دور لمدة 3 أدوار.`,'good');
    if(r.tier==='part')await skScratch(f,s);return}
  if(id==='freeze'){if(r.tier==='fail')return miss(`التلج ما مسكش في ${f.name}.`);
    const n=r.tier==='full'?2:1;fxOn(f.fx,'skip',{n,ice:1});SFX.freeze();burst(me,fe(),'#9fe0ff',40);await sleep(520);flash('#bfeaff');cls(fe(),'hit');floatAt(fe(),FF(f,'اتجمّد!','اتجمّدت!'),'#bfeaff','',26);
    return say(`${f.name} ${FF(f,'اتجمّد','اتجمّدت')}: ${FF(f,'هيفوّت','هتفوّت')} ${n>1?'دورين':FF(f,'دوره','دورها')+' الجاي'}.`,'good')}
  if(id==='snatch'){if(r.tier==='fail')return miss(`${f.name} ${FF(f,'خد باله','خدت بالها')} {وانت بتمد|وانتي بتمدي} إيدك.. ما {خدتش|خدتيش} حاجة.`);
    f.snatched=1;SFX.snatch();const dr=FOE_DROPS[f.art]||[],Lt=LOOT[f.art]||LOOT.dummy;
    const k=r.tier==='full'&&dr.length&&Math.random()<(f.art==='nadaha'?.2:.5)?pick(dr)[0]:null;
    if(k){addRes(h,k,1);C.mats.push({k,n:1});burst(fe(),me,MAT[k].c,22);floatAt(fe(),'+1 '+resN(k),RARE[matTier(k)].c,'',20);setTimeout(SFX.pickup,250);
      if(matTier(k)>=2){SFX.shimmer();flash(RARE[matTier(k)].c)}
      await say(`{خطفت|خطفتي} ${resN(k)}${resN(k).includes(f.name)?'':' من '+f.name}!`,'good')}
    else{let m=Lt.m[0]+rnd(Lt.m[1]-Lt.m[0]+1)-1;if(r.tier==='part')m=Math.ceil(m/2);m=Math.max(2,Math.round(m*lootMul(h)));h.money+=m;
      floatAt(fe(),'+'+m+' جنيه','#f3d48f','',22);coinsTo(fe(),$('#money'),m);
      await say(`{خطفت|خطفتي} ${m} جنيه من ${f.name}!`,'good');if(h.money>=500)ach('rich')}
    if(r.tier==='part')await skScratch(f,s);return}
}
async function aoeAct(s,r){const C=S.combat,h=S.hero,big=s.id==='storm',ts=C.foes.filter(x=>x.hp>0);
  if(r.tier==='fail'){C.combo=0;SFX.miss();return say(`${s.n} ما ${big?'نزلتش':'نزلش'}.. السحر فلت من إيدك.`,'bad')}
  let d=(big?rnd(6)+rnd(6)+(h.lvl-1):rnd(4)+1+Math.floor(h.lvl/2))+thb(h);if(r.tier==='part')d=Math.ceil(d/2);if(r.crit)d*=2;d=Math.max(1,d);
  const mc=!C.tutorial&&Math.random()<critChance(h);if(mc){d=Math.ceil(d*1.5);masterWord();await sleep(420)}
  C.combo++;if(S.run)S.run.maxCombo=Math.max(S.run.maxCombo,C.combo);
  (big?SFX.storm:SFX.bolt)();flash(big?'#ff9a4a':'#eaf6ff');shake();
  ts.forEach((x,i)=>setTimeout(()=>hurtFoe(x,d,{fx:big?'storm':'bolt',crit:r.crit||mc}),i*160));await sleep(620+ts.length*160);
  if(C.combo>=2)comboAt(C.combo);const dead=ts.filter(x=>x.hp<=0);
  await say(`${r.crit?'ضربة حظ! ':''}${mc?'ضربة معلّم! ':''}${s.n} ${big?'نزلت':'نزل'} على ${ts.length>1?'كل الأعداء':ts[0].name}: -${d}${r.tier==='part'?` (نص ${big?'قوتها':'قوته'})`:''}${dead.length?' · '+dead.map(x=>x.name+' '+FF(x,'وقع','وقعت')).join('، ')+'!':''}`,'good');
  if(mc){ach('master');if(S.run)S.run.masters=(S.run.masters||0)+1}if(C.combo===3)ach('combo')}

/* foe statuses tick at the start of its own turn; true = its turn is over */
async function foeTick(e){const x=e.fx;
  if(x.poison){const p=x.poison,d=Math.min(e.hp,p.d);p.n--;if(p.n<=0)delete x.poison;
    hurtFoe(e,d,{fx:'poison'});await sleep(320);
    await say(`السم بياكل في ${e.name}: -${d}${e.hp<=0?` · ${e.name} ${FF(e,'وقع','وقعت')} من السم!`:x.poison?'':' (السم خلص)'}`,'good',950);
    if(e.hp<=0)return true}
  if(x.skip){const k=x.skip;k.n--;if(k.n<=0)delete x.skip;cls($('#foe'+e.id),'hit');(k.ice?SFX.freeze:SFX.stun)();
    floatAt($('#foe'+e.id),k.ice?FF(e,'متجمّد','متجمّدة'):k.daze?FF(e,'مدروخ','مدروخة'):FF(e,'متلخبط','متلخبطة'),k.ice?'#bfeaff':k.daze?'#d8c8ff':'#ffd36a','',22);
    if(k.daze){await say(`${e.name} لسه ${FF(e,'مدروخ','مدروخة')}.. ${FF(e,'مقدرش يهجم','مقدرتش تهجم')} الدور ده.`,'good',900);return true}
    await say(k.ice?`${e.name} ${FF(e,'متجمّد','متجمّدة')} ومش ${FF(e,'قادر يتحرك','قادرة تتحرك')}.${x.skip?' (فاضل دور)':''}`:`${e.name} لسه ${FF(e,'متلخبط','متلخبطة')} من الخبطة، ${FF(e,'فوّت','فوّتت')} ${FF(e,'دوره','دورها')}.`,'good',950);
    return true}
  return false}
/* «علاج للكل» ticks when the foes are done */
async function regenTick(){const C=S.combat,h=S.hero,c=S.comp,m=C.me.regen,p=C.cp.regen;if(!m&&!p)return;
  let a1=0,a2=0;if(m){if(h.hp>0){a1=Math.min(3,MXH(h)-h.hp);h.hp+=a1}if(--m.n<=0)delete C.me.regen}
  if(p){if(c.hp>0){a2=Math.min(3,c.max-c.hp);c.hp+=a2}if(--p.n<=0)delete C.cp.regen}
  combat();if(a1)healFx($('#meCard'),a1);if(a2)healFx($('#compCard'),a2);if(!a1&&!a2)SFX.regen();
  const left=(C.me.regen||C.cp.regen||{}).n;
  const got=[a1?`+${a1} {ليك|ليكي}`:'',a2?`+${a2} لـ${c.name}`:''].filter(Boolean).join(' و');
  await say(`علاج للكل: ${got||'الصحة كاملة'}${left?` (فاضل ${left===1?'دور':left===2?'دورين':left+' أدوار'})`:' (خلص)'}.`,'good',950)}

/* ---------- sound hooks: every screen, tap and event gets a sound ---------- */
let lastScr=null,lastScene=null,quietToast=0;
function modeFor(){const s=S.screen;
  if(s==='combat'){const C=S.combat;return C&&C.foes.some(f=>f.art==='nadaha')?'boss':'combat'}
  if(s==='story'){const sc=SC[S.scene];const k='amb_'+((sc&&sc.art)||'village');return SONGS[k]?k:'amb_village'}
  if(s==='loot')return 'win';
  if(s==='shop'||s==='market')return 'amb_market';
  if(s==='mine')return SONGS.amb_mountain?'amb_mountain':'amb_fields';
  if(s==='fish')return 'amb_canal';
  if(s==='end')return S.lost||(S.endRes&&S.endRes.sold)?'lost':'win';
  return 'title'}
function afterRender(){const s=S.screen;
  if(lastScr&&s!==lastScr&&s!=='combat')SFX.whoosh();
  if(s==='story'&&S.scene!==lastScene&&lastScr){if(lastScr==='story'||lastScr==='combat')SFX.steps();SFX.page()}
  lastScr=s;if(s==='story')lastScene=S.scene;
  setMusic(modeFor())}
